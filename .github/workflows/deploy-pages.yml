name: Deploy Kingdom Clash to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vendor pinned Three.js r164 locally
        run: |
          mkdir -p vendor
          npm pack three@0.164.1 --silent
          tar -xzf three-0.164.1.tgz package/build/three.module.min.js
          cp package/build/three.module.min.js vendor/three.module.min.js
          rm -rf package three-0.164.1.tgz
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
