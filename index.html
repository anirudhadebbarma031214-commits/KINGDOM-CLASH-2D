<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kingdom Clash: Rise of the Realm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1511;color:#f5eedb;font:14px system-ui,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:#101914d9;z-index:2}#top b{padding:5px 9px;border:1px solid #586b4d;border-radius:8px;background:#17251d}
#bar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}button{font:inherit;color:#f8efd8;border:1px solid #66734f;border-radius:9px;background:linear-gradient(#354a35,#223327);padding:9px 11px;cursor:pointer}button:disabled{opacity:.4}
#panel{position:fixed;right:8px;top:52px;width:min(300px,60vw);max-height:60vh;overflow:auto;background:#101a14ee;border:1px solid #586b4d;border-radius:12px;padding:10px;z-index:3;display:none}#panel button{display:block;width:100%;margin:5px 0;text-align:left}
#msg{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#f1c879;color:#172017;font-weight:700;padding:8px 14px;border-radius:9px;z-index:4;opacity:0;transition:.2s;pointer-events:none}#msg.on{opacity:1}
#ov{position:fixed;inset:0;background:#0d1511;z-index:9;display:grid;place-items:center;text-align:center}#ov h1{font:38px Georgia,serif;margin:0 0 6px}</style></head><body>
<div id="ov"><div><h1>KINGDOM CLASH</h1><p id="ovt">Loading the realm…</p><div id="menu" style="display:none"><button id="cont">Continue</button> <button id="newg">New Game</button></div></div></div>
<div id="top"><b id="r_wood"></b><b id="r_food"></b><b id="r_stone"></b><b id="r_gold"></b><b id="lvl"></b><b id="army"></b></div>
<div id="panel"></div><div id="msg"></div>
<div id="bar"><button id="bBuild">Build</button><button id="bTrain">Train</button><button id="bCastle">Upgrade castle</button><button id="bQuest">Quests</button><button id="bBattle">Attack bandit camp</button><button id="bSel" style="display:none">Select all</button><button id="bRet" style="display:none">Retreat</button></div>
<script type="module" src="js/main.js"></script></body></html>
